spring.application.name=solarminer-stratum-proxy

server.port=8090
proxy.coins.bitcoin.port=3333

# How often the proxy re-fetches fee targets from the central fee-backend, in ms.
# Default 60s: a referral created in the admin portal is saved to fee-backend
# immediately, and the proxy picks it up on the next refresh (was 1h before).
# Lower this (e.g. 30000) if you want new referrals to route faster; raise it to
# reduce load on fee-backend. fee-backend saves synchronously on write, so the
# only lag is this poll.
solarminer.fee.refresh-ms=60000

# Referral code whose dev-fee split this proxy enforces (env:
# SOLARMINER_FEE_REFERRAL). "solarminer" = the house dev fee only. Set to the
# node's referral code so the referrer share is routed under their worker.
# fee-backend resolves unknown codes to "solarminer".
solarminer.fee.referral=solarminer
